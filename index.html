<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060d19"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Sala Vermelha | Simulador</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap');
:root{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#edf7ff;background:#060d19;font-synthesis:none}*{box-sizing:border-box}html{min-height:100%;background:#060d19}body{margin:0;min-height:100vh;background:radial-gradient(ellipse 80% 32% at 95% -5%,rgba(11,174,222,.22),transparent 70%),radial-gradient(ellipse 70% 36% at -20% 35%,rgba(213,31,79,.12),transparent 75%),#060d19}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #43d9f8;outline-offset:3px}header{position:sticky;top:0;z-index:5;background:rgba(6,13,25,.76);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(130,202,235,.13);padding:13px max(18px,calc((100vw - 1000px)/2));display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 36px rgba(0,0,0,.1)}.brand{display:flex;align-items:center;gap:12px;font-family:Outfit,'DM Sans',sans-serif;font-weight:800;letter-spacing:.065em;font-size:14px;line-height:1.3}.logo{width:46px;height:46px;flex:none;background:linear-gradient(145deg,#fb4666,#bc164b);border:1px solid #ff7a96;border-radius:15px;display:grid;place-items:center;font-size:27px;box-shadow:0 0 0 4px rgba(237,46,93,.08),0 10px 30px rgba(240,32,84,.28);text-shadow:0 0 16px white}.muted{color:#9cb0c4}.small{font-size:12px}main{max-width:1000px;margin:auto;padding:34px 18px 100px}h1,h2{font-family:Outfit,'DM Sans',sans-serif;letter-spacing:-.035em}h1{font-size:clamp(28px,5vw,42px);line-height:1.12;margin:0 0 12px;font-weight:800}h2{font-size:21px;margin:0 0 16px;font-weight:700}p{line-height:1.7}main>h1:first-child{max-width:670px;background:linear-gradient(110deg,#fff 20%,#bdeefb 70%,#59c6e8);background-clip:text;-webkit-background-clip:text;color:transparent}main>h1:first-child+p{font-size:15px;margin-bottom:24px}.panel{background:linear-gradient(140deg,rgba(21,38,57,.94),rgba(11,24,42,.96));border:1px solid rgba(117,179,211,.19);border-radius:24px;padding:25px;margin:22px 0;box-shadow:0 14px 45px rgba(0,0,0,.21),inset 0 1px rgba(255,255,255,.035)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.stat{padding:21px 12px;background:linear-gradient(155deg,rgba(22,55,78,.94),rgba(12,30,49,.95));border:1px solid rgba(70,187,224,.18);border-radius:18px;text-align:center;position:relative;overflow:hidden}.stat:before{content:'';position:absolute;left:18%;right:18%;top:0;height:1px;background:linear-gradient(90deg,transparent,#39d3f8,transparent)}.stat strong{display:block;font-family:Outfit,sans-serif;font-size:clamp(26px,4vw,38px);color:#ebfbff;letter-spacing:-.04em;margin-bottom:3px}.stat:nth-child(2) strong{color:#57e4bc}.stat:nth-child(3) strong{color:#f4a5bb}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar select,.toolbar input{background:#0a1a2d;border:1px solid #2b4b65;border-radius:13px;color:#eafaff;padding:14px;min-width:0;outline:none}.toolbar input{flex:1;min-width:180px}.toolbar input::placeholder{color:#8299ae}.toolbar input:focus,.toolbar select:focus{border-color:#2ac7eb;box-shadow:0 0 0 3px rgba(42,199,235,.12)}.tiles{display:grid;grid-template-columns:repeat(10,1fr);gap:9px}.tile{border:1px solid rgba(75,134,168,.35);background:linear-gradient(160deg,#1c3449,#102337);color:#c5dcea;border-radius:12px;aspect-ratio:1;min-width:0;font-family:Outfit,sans-serif;font-weight:700;font-size:14px;transition:transform .18s,border-color .18s,box-shadow .18s}.tile.done{background:linear-gradient(145deg,#146a57,#0b3c3a);border-color:#28bd99;color:#b9ffeb}.tile.failed{background:linear-gradient(145deg,#6d2943,#3a1b35);border-color:#d95a7b;color:#ffe2eb}.tile:hover{transform:translateY(-3px);border-color:#4be0f8;box-shadow:0 7px 18px rgba(18,180,218,.15)}.btn{border:1px solid rgba(255,255,255,.15);background:linear-gradient(115deg,#e52c60,#fa526c);color:white;border-radius:13px;padding:13px 20px;font-weight:800;box-shadow:0 9px 25px rgba(216,33,81,.23);transition:transform .16s,filter .16s}.btn:hover{transform:translateY(-1px);filter:brightness(1.12)}.btn.secondary{background:linear-gradient(135deg,#1b3850,#132b42);border-color:#34556c;box-shadow:none;color:#cfefff}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.tag{display:inline-block;padding:7px 12px;background:rgba(229,44,96,.15);border:1px solid rgba(245,78,114,.33);color:#ff9ab3;border-radius:30px;font-size:11px;letter-spacing:.07em;font-weight:800}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode{background:linear-gradient(140deg,#15374b,#10243c);border:1px solid #2b6177;border-radius:19px;padding:25px;text-align:left;color:white;min-height:150px;transition:transform .18s,border-color .18s,box-shadow .18s}.mode:nth-child(2){background:linear-gradient(140deg,#3b2039,#1b263f);border-color:#6a3a58}.mode strong{display:block;font-family:Outfit,sans-serif;font-size:21px;margin-bottom:12px}.mode:hover{transform:translateY(-3px);border-color:#51e4f6;box-shadow:0 12px 26px rgba(0,0,0,.25)}.fact{border:1px solid #2b4c63;border-radius:14px;margin:10px 0;overflow:hidden;background:rgba(6,22,38,.54)}.fact button{background:transparent;color:#e8f7ff;border:0;padding:16px;width:100%;text-align:left;display:flex;justify-content:space-between;font-weight:700}.fact button span{color:#50d9f4}.fact p{padding:0 16px 16px;margin:0;color:#bdd1df}.option{width:100%;text-align:left;border:1px solid #35516b;background:linear-gradient(135deg,#142c42,#102238);color:#eef8ff;padding:17px;border-radius:14px;margin:7px 0;line-height:1.6;transition:border-color .15s,background .15s}.option:hover:not(:disabled){border-color:#50d9f4;background:#183b53}.option strong{color:#61d7f1;margin-right:6px}.option.correct{border-color:#3be2b3;background:linear-gradient(120deg,#104e49,#133c3c)}.option.wrong{border-color:#fb668c;background:linear-gradient(120deg,#58253c,#392337)}.option:disabled{cursor:default}.feedback{border:1px solid #3a6076;border-radius:17px;padding:20px;margin-top:18px;background:#102b3e;line-height:1.6}.feedback.good{border-color:#2cc69a;background:linear-gradient(135deg,#103d39,#102b3a)}.feedback.bad{border-color:#e15c81;background:linear-gradient(135deg,#43263a,#172c40)}.feedback>strong{font-size:18px}.feedback details{margin-top:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.13)}.feedback summary{cursor:pointer;color:#91e9f8;font-weight:700}.notice{border-left:3px solid #f6b95b;padding:13px 16px;background:rgba(201,133,39,.1);border-radius:0 10px 10px 0;font-size:13px;line-height:1.6;color:#f6d9a9}.progress{height:7px;background:#264357;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#f34275,#4bdaf3)}.hidden{display:none}.footer{margin-top:28px;color:#819caf;font-size:12px;line-height:1.7}select option{background:#0b1b2c;color:#fff}@media(max-width:540px){header{padding:12px 16px}.brand{font-size:12px}.logo{width:41px;height:41px}.tiles{grid-template-columns:repeat(6,1fr);gap:8px}.modegrid{grid-template-columns:1fr}main{padding:25px 14px 80px}.panel{padding:18px;border-radius:19px}.stats{gap:8px}.stat{padding:15px 5px}.stat strong{font-size:27px}.toolbar select,.toolbar input{width:100%}.mode{min-height:120px;padding:20px}h1{font-size:29px}}

.medical-art{position:relative;display:flex;justify-content:center;align-items:center;min-height:180px;margin:0 0 18px;border:1px solid rgba(64,210,239,.2);border-radius:20px;background:radial-gradient(ellipse at center,rgba(35,120,156,.25),rgba(7,22,39,.5) 75%);overflow:hidden}.medical-art img{height:190px;width:min(100%,290px);object-fit:contain;mix-blend-mode:screen;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25))}.medical-art span{position:absolute;bottom:9px;left:12px;color:#80b7ca;font-size:9px;font-weight:800;letter-spacing:.15em}.pagination{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:20px}.pagination .btn{padding:11px 14px;font-size:13px}.pagination span{color:#9dd5e6;font-size:13px;font-weight:700}.score-pill{display:inline-flex;border:1px solid #4c9a9b;background:rgba(22,132,137,.16);border-radius:30px;padding:8px 14px;color:#9cf6db;font-size:13px;font-weight:800;margin:8px 0 18px}@media(max-width:540px){.medical-art{min-height:145px}.medical-art img{height:160px}}
</style></head><body><header><div class="brand"><span class="logo">✚</span><span>SALA VERMELHA<br><span class="small muted" style="font-weight:400">Treinamento clínico</span></span></div><button class="btn secondary small" id="homeBtn">Casos</button></header><main id="app"><p>Carregando casos...</p></main><script src="app.js" defer></script></body></html>
